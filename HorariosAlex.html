<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d6efd">
<title>Mis Medicamentos</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,sans-serif; }
  body { background:#f0f4f8; padding:16px; padding-bottom:80px; }
  h1 { color:#0d6efd; font-size:22px; margin-bottom:16px; text-align:center; }
  .tarjeta { background:#fff; border-radius:12px; margin-bottom:12px; padding:16px; box-shadow:0 2px 6px rgba(0,0,0,.08); display:flex; justify-content:space-between; align-items:center; }
  .info { flex:1; }
  .medicamento { font-weight:600; color:#222; font-size:16px; }
  .dosis { font-size:14px; color:#666; margin-top:4px; }
  .btn-add { position:fixed; bottom:20px; right:20px; width:60px; height:60px; border-radius:50%; background:#0d6efd; color:#fff; border:none; font-size:32px; box-shadow:0 4px 12px rgba(13,110,253,.4); cursor:pointer; }
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); align-items:center; justify-content:center; padding:20px; z-index:10; }
  .modal.activo { display:flex; }
  .modal-contenido { background:#fff; border-radius:16px; padding:20px; width:100%; max-width:400px; }
  .modal-contenido h2 { margin-bottom:16px; color:#0d6efd; font-size:18px; }
  .modal-contenido input { width:100%; padding:12px; margin-bottom:12px; border:1px solid #ccc; border-radius:8px; font-size:15px; }
  .modal-botones { display:flex; gap:10px; margin-top:10px; }
  .modal-botones button { flex:1; padding:12px; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-size:15px; }
  .btn-guardar { background:#0d6efd; color:#fff; }
  .btn-cancelar { background:#eee; color:#333; }
  .eliminar { background:#ffe5e5; color:#dc3545; border:none; padding:10px 14px; border-radius:8px; margin-left:10px; cursor:pointer; font-weight:bold; }
  .vacio { text-align:center; color:#999; padding:30px; }
  .contador { text-align:center; font-size:12px; color:#888; margin-top:-10px; margin-bottom:15px; }
</style>
</head>
<body>

<h1>💊 Mis Medicamentos</h1>
<div class="contador" id="contador"></div>
<div id="contenedor"></div>

<button class="btn-add" onclick="abrirModal()">+</button>

<div class="modal" id="modal">
  <div class="modal-contenido">
    <h2>Agregar Medicamento</h2>
    <input type="text" id="nombre" placeholder="Nombre del medicamento (ej: Paracetamol)">
    <input type="text" id="dosis" placeholder="Dosis y horario (ej: 1 pastilla cada 8h)">
    <div class="modal-botones">
      <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-guardar" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<script>
let medicamentos = JSON.parse(localStorage.getItem("medicamentosApp") || "[]");
const MAXIMO = 6; // Límite de 6 líneas

function render() {
  const cont = document.getElementById("contenedor");
  const contador = document.getElementById("contador");
  cont.innerHTML = "";
  
  contador.innerText = `Medicamentos agregados: ${medicamentos.length} de ${MAXIMO}`;

  if (medicamentos.length === 0) {
    cont.innerHTML = '<div class="vacio">No hay medicamentos aún.<br>Toca + para agregar</div>';
    return;
  }

  medicamentos.forEach(m => {
    const div = document.createElement("div");
    div.className = "tarjeta";
    div.innerHTML = `
      <div class="info">
        <div class="medicamento">${m.nombre}</div>
        <div class="dosis">${m.dosis}</div>
      </div>
      <button class="eliminar" onclick="eliminar(${m.id})">✕</button>
    `;
    cont.appendChild(div);
  });
}

function abrirModal() {
  if (medicamentos.length >= MAXIMO) {
    alert("Ya tienes los " + MAXIMO + " espacios llenos. Elimina uno para agregar otro.");
    return;
  }
  document.getElementById("modal").classList.add("activo"); 
}

function cerrarModal() { 
  document.getElementById("modal").classList.remove("activo"); 
  document.getElementById("nombre").value = "";
  document.getElementById("dosis").value = "";
}

function guardar() {
  const nombre = document.getElementById("nombre").value.trim();
  const dosis = document.getElementById("dosis").value.trim();
  
  if (!nombre || !dosis) { 
    alert("Por favor, completa el nombre y el horario."); 
    return; 
  }
  
  medicamentos.push({ id: Date.now(), nombre, dosis });
  localStorage.setItem("medicamentosApp", JSON.stringify(medicamentos));
  cerrarModal();
  render();
}

function eliminar(id) {
  if (!confirm("¿Eliminar este medicamento?")) return;
  medicamentos = medicamentos.filter(m => m.id !== id);
  localStorage.setItem("medicamentosApp", JSON.stringify(medicamentos));
  render();
}

render();
</script>
</body>
</html>
